apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-readmission
  labels:
    app: hospital-readmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-readmission
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hospital-readmission
    spec:
      containers:
        - name: hospital-readmission-api
          # IMAGE_TAG_PLACEHOLDER is replaced at apply time with sha-<commit> (see RUN_GUIDE).
          image: ghcr.io/harshith1476/hospital-readmission-ml:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
