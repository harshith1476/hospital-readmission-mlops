# Practical 12: Prometheus scrapes the public Render service over HTTPS.
# Target = hostname only (no https://). Replace it if your Render URL is different.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/hospital_api_alerts.yml

scrape_configs:
  - job_name: "hospital-readmission-api"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - "hospital-readmission-ml-hc26.onrender.com"
