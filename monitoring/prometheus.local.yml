# Optional: scrape a LOCAL container (docker run -p 5000:5000 ...) instead of Render.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/hospital_api_alerts.yml

scrape_configs:
  - job_name: "hospital-readmission-api"
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:5000"
